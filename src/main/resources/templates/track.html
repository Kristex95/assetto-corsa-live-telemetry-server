<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="/css/track.css">
    <title>Live Track</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #373737;
      }
      table {
        border-collapse: collapse;
        width: 100%;
        margin: 0;
      }
      th,
      td {
        padding: 2px 6px;
        text-align: center;
      }
      .bg-purple {
        background-color: #a602a6 !important;
        --bs-table-bg-type: #a602a6 !important;
        color: white;
      }
      .bg-orange {
        background-color: #eabe0e !important;
        --bs-table-bg-type: #eabe0e !important;
        color: white;
      }
    </style>
  </head>
  <body>
    <div class="container-full">
      <div class="row row-cols-2">
        <div class="col">
          <table id="playersTable" class="table table-dark table-striped table-hover">
            <thead>
              <tr class="table-dark">
                <th scope="col">Pos</th>
                <th scope="col">Num</th>
                <th scope="col">Player Name</th>
                <th scope="col">Best Lap</th>
                <th scope="col">Last Lap</th>
                <th scope="col">Compund</th>
                <th scope="col">Car Name</th>
                <th scope="col" th:each="i : ${#numbers.sequence(1, splitsCount)}"
                  th:text="'Sector ' + ${i}">
                </th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
        <div class="col">
          <canvas id="trackCanvas" width="100%" height="auto"></canvas>
          <div id="fastest-sectors"></div>
        </div>
      </div>
    </div>
    <script th:inline="javascript">
      const nodes = [[${nodes}]];
      const port = [[${port}]];
    </script>
    <script src="/js/track.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
